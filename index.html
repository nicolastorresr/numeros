["El 4, el 7 y el 9 en cada contexto",["Contexto","4","7","9"],[["人 personas","よにん","ななにん／しちにん","きゅうにん／くにん"],["時 hora","よじ","しちじ","くじ"],["月 mes","しがつ","しちがつ","くがつ"],["日 día","よっか","なのか","ここのか"],["分 minutos","よんぷん","ななふん","きゅうふん"],["歳 edad","よんさい","ななさい","きゅうさい"],["円 yen","よえん","ななえん","きゅうえん"],["年 años","よねん","しちねん／ななねん","くねん／きゅうねん"],["回 veces","よんかい","ななかい","きゅうかい"],["本 largos","よんほん","ななほん","きゅうほん"]],"Las celdas en naranja no empiezan con よん / なな / きゅう: son los casos borde."],
["1, 6, 8 y 10: cuándo se contrae (っ)",["Contador","1","6","8","10"],[["歳 edad","いっさい","ろくさい","はっさい","じゅっさい"],["分 minutos","いっぷん","ろっぷん","はっぷん","じゅっぷん"],["回 veces","いっかい","ろっかい","はっかい","じゅっかい"],["本 largos","いっぽん","ろっぽん","はっぽん","じゅっぽん"],["匹 animales","いっぴき","ろっぴき","はっぴき","じゅっぴき"],["個 pequeños","いっこ","ろっこ","はっこ","じゅっこ"],["冊 libros","いっさつ","ろくさつ","はっさつ","じゅっさつ"],["か月 meses","いっかげつ","ろっかげつ","はっかげつ","じゅっかげつ"]],"Regla: 1, 8 y 10 contraen casi siempre; 6 contrae solo con か, ぱ-fila y ぽ (ろっかい, ろっぽん) pero no con さい, さつ."],
["Prefijos de tiempo × unidad",["","日","週","月","年"],[["anteayer / hace 2","おととい","せんせんしゅう","せんせんげつ","おととし"],["pasado","きのう","せんしゅう","せんげつ","きょねん"],["actual","きょう","こんしゅう","こんげつ","ことし"],["siguiente","あした","らいしゅう","らいげつ","らいねん"],["en 2 (pasado mañana)","あさって","さらいしゅう","さらいげつ","さらいねん"]],"Solo la columna 日 y la de 年 son irregulares; semana y mes usan lecturas chinas regulares."],
["Pares que se confunden",["Qué se compara","Forma A","Forma B","Clave"],[["Día 20 vs 20 años","二十日 はつか","二十歳 はたち","Ambos irregulares; はつか fecha, はたち edad."],["Día 1 vs un día","一日 ついたち","一日 いちにち","ついたち = día 1; いちにち = un día entero."],["Hora vs duración","四時 よじ","四時間 よじかん","Solo se agrega かん."],["Piso vs veces","三階 さんがい","三回 さんかい","が vs か."],["Mes vs duración","一月 いちがつ","一か月 いっかげつ","がつ = mes; かげつ = duración."],["Edad vs años","一歳 いっさい","一年 いちねん","歳 = edad; 年 = año o duración."],["Mañana","明日 あした","明日 あす／みょうにち","Cotidiano / escrito / muy formal."],["Personas","一人 ひとり","一名 いちめい","人 general; 名 formal."],["Este año / este mes","今年 ことし","今月 こんげつ","今年 es irregular; 今月 regular."],["Cada mes / cada año","毎月 まいつき","毎年 まいとし","Ambos con lectura nativa (つき, とし)."]],"Mismo kanji, lectura distinta, o una letra de diferencia."]];
// ===== motor
const $=id=>document.getElementById(id);let sec="n",cur="all";
const grp=()=>D.filter(d=>d.s==sec&&(cur=="all"||d.c==cur));
function ctor(){let y=+$("cy").value||2026,m=Math.min(12,Math.max(1,+$("cm").value||1)),d=+$("cd").value||1;y=Math.min(2999,Math.max(1000,y));d=Math.min(d,new Date(Date.UTC(y,m,0)).getUTCDate());
 const w=new Date(Date.UTC(y,m-1,d)).getUTCDay(),k=y+"年"+m+"月"+d+"日（"+WJ[w]+"曜日）",h=yr(y)+mo(m)+dy(d)+"、"+WK[w];
 let e="";const em=(n,nm,rd)=>nm+(n==1?"元":n)+"年 ("+rd+(n==1?"がん":kn(n))+"ねん)";
 if(y>2019||(y==2019&&m>=5))e=em(y-2018,"令和","れいわ ");else if(y>=1989)e=em(y-1988,"平成","へいせい ");else if(y>=1927)e=em(y-1925,"昭和","しょうわ ");
 $("cout").innerHTML=`<div class="big jp">${k}</div><div class="jp" style="color:var(--red);font-size:1.15rem">${h}</div><i>${cap(ro(yo(kn(y," "))+" ねん "+mo(m)+" "+dy(d)+", "+WK[w]))}</i><br><b>${WES[w][0].toUpperCase()+WES[w].slice(1)}, ${d} de ${MES[m]} de ${y}</b><br>${e?JW(e)+" · ":""}<span class="w" style="color:var(--warn)">${[yr(y).includes("よね")?"año con よ":"",[4,7,9].includes(m)?"mes irregular":"",[1,14,17,19,20,24,27,29].includes(d)?"día irregular":""].filter(Boolean).join(" · ")}</span>`}
function tbl(){return T.map(([t,c,r,n])=>{const b={1:"よん",2:"なな",3:"きゅう"};return`<div class="box"><h3>${t}</h3><div class="tw"><table><tr>${c.map(x=>`<th>${JW(x)}</th>`).join("")}</tr>${r.map(x=>`<tr>${x.map((y,i)=>`<td class="jp ${t[0]=="E"&&i&&!y.startsWith(b[i])?"x":""}">${y}</td>`).join("")}</tr>`).join("")}</table></div><p class="cnt">${JW(n)}</p></div>`}).join("")}
function render(){
 const v=sec=="v",f=sec=="f";
 $("sn").innerHTML=Object.entries(S).map(([k,x])=>`<button class="f sc ${k==sec?"on":""}" data-s="${k}">${x[0]}</button>`).join("");
 $("nav").hidden=v;$("qb").hidden=v;$("grid").hidden=v;$("cmp").hidden=!v;$("ctor").hidden=!f;
 $("nav").innerHTML=[["all","Todos"],...Object.entries(S[sec][1]).map(([k,x])=>[k,x[0]])].map(([k,t])=>`<button class="f ${k==cur?"on":""}" data-v="${k}">${t}</button>`).join("");
 document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{sec=b.dataset.s;cur="all";render()});
 document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{cur=b.dataset.v;render()});
 $("pat").innerHTML=JW(cur=="all"||v?S[sec][2]:S[sec][1][cur][1]);
 if(v){$("cmp").innerHTML=tbl();$("cnt").textContent="";return}
 if(f&&!$("cy").value){const n=new Date();$("cy").value=n.getFullYear();$("cm").value=n.getMonth()+1;$("cd").value=n.getDate()}
 if(f)ctor();
 const g=grp(),name=cur=="all"?"Todos":S[sec][1][cur][0];
 $("qb").textContent="Quiz · "+S[sec][0]+" · "+name;
 $("cnt").textContent=g.length+" tarjetas · "+g.filter(d=>d.f).length+" casos borde ⚠";
 $("grid").innerHTML=g.map(d=>`<div class="c ${d.f?"w":""}"><div class="in"><div class="s fr"><div><b class="jp">${d.k}</b><div class="h jp">${d.h}</div><div class="cnt"><i>${ro(d.hs||d.h)}</i></div><small>${d.m}</small>${d.f?'<span class="bd">⚠ caso borde</span>':""}</div></div>
 <div class="s bk"><p><b class="jp" style="font-size:1.4rem;color:var(--red)">${d.k}</b> <span class="jp">${d.h}</span> <i>(${ro(d.h)})</i><br><b>${d.m}</b> ${d.f?'<span class="bd">⚠ borde</span>':""}</p>
 <p><span class="lb">PATRÓN / NOTA</span><br>${JW(d.n)}</p><p><span class="lb">EJEMPLO</span><br><span class="ex jp">${d.e}</span><br><i>${d.r}</i><br>${d.t}</p></div></div></div>`).join("");
 document.querySelectorAll(".c").forEach(c=>c.onclick=()=>c.classList.toggle("fl"));
}
["cy","cm","cd"].forEach(i=>$(i).oninput=ctor);
$("ct").onclick=()=>{const n=new Date();$("cy").value=n.getFullYear();$("cm").value=n.getMonth()+1;$("cd").value=n.getDate();ctor()};
const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
let Q=[],i=0,sc=0;
$("qb").onclick=()=>{Q=shuf(grp()).slice(0,10);i=0;sc=0;$("home").hidden=true;$("quiz").hidden=false;ask()};
function ask(){
 const q=Q[i],pool=D.filter(d=>d.s==sec&&d!=q),cand=[...shuf(pool.filter(d=>d.c==q.c)),...shuf(pool.filter(d=>d.c!=q.c))];
 const num=/^[\d\s.,%]+$/.test(q.m),al=[];if(q.h!=q.k)al.push("r");al.push("j");if(!num)al.push("m");
 const kind=al[i%al.length];let ans,title,show,key;
 if(kind=="r"){title="¿Cómo se lee?";show=q.k;key=d=>d.h;ans=q.h}
 else if(kind=="j"){title="¿Cómo se escribe?";show=q.h;key=d=>d.k;ans=q.k}
 else{title="¿Qué significa?";show=q.k;key=d=>d.m;ans=q.m}
 const ds=[...new Set(cand.map(key).filter(x=>x!=ans))].slice(0,3),opts=shuf([ans,...ds]);
 $("quiz").innerHTML=`<div class="cnt">Pregunta ${i+1} de ${Q.length}</div><div class="big jp" style="${show.length>5?"font-size:2.2rem":""}">${show}</div><p>${title}</p>`+opts.map(o=>`<button class="o jp">${o}</button>`).join("")+`<div class="msg" id="msg"></div><div class="cnt" id="nt"></div><button class="q" id="nx" hidden>Siguiente</button>`;
 document.querySelectorAll(".o").forEach(b=>b.onclick=()=>{
  const ok=b.textContent==ans;if(ok)sc++;
  document.querySelectorAll(".o").forEach(x=>{x.disabled=true;if(x.textContent==ans)x.classList.add("ok")});
  if(!ok)b.classList.add("bad");
  $("msg").textContent=ok?"✔ ¡Correcto!":"✘ Incorrecto. Respuesta correcta: "+ans;$("msg").style.color=ok?"var(--ok)":"var(--bad)";
  $("nt").innerHTML=JW(q.n);$("nx").hidden=false;$("nx").textContent=i+1<Q.length?"Siguiente":"Ver puntaje";
  $("nx").onclick=()=>{i++;i<Q.length?ask():end()};
 });
}
function end(){$("quiz").innerHTML=`<div class="sun">${sc}</div><h2>Puntaje: ${sc} / ${Q.length}</h2><button class="q" id="bk">Volver</button>`;$("bk").onclick=()=>{$("quiz").hidden=true;$("home").hidden=false;render()}}
render();
</script></body></html>
